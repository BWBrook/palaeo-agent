# Reviewed snapshot of the Sprint 7 design, agreement and implementation handoff.
# The board exporter's CLI exports a whole project. This snapshot instead calls
# its unchanged load_policy/fetch_thread/render functions for thread_ids only.
# New messages must be reviewed before extending reviewed_message_ids/through.
project = "palaeo-agent"
thread_ids = [136]
reviewed_message_ids = [2865, 2866, 2867, 2886]
reviewed_through = 2886
exporter_revision = "62c228024090dad65bc43114c246964965f19250"
flag_terms = ["password", "token", "credential", "secret", "student", "email", "address", "hostname", "ssh", "tailscale", "vpn", "copyright", "excerpt", "access", "private key"]

# 2865: the quoted excerpts are Barry's own project instructions; no third-party
# paper text or other person's private correspondence is reproduced.
# 2866: 'access path' describes API delivery; 'Secret scan' records a completed
# check. Neither passage contains private access routes, credentials or hosts.
cleared = [2865, 2866]

# Other reviewed messages (2867, 2886) contain scientific and implementation
# decisions, with no flagged content requiring clearance or withholding.
# The built-in exporter also redacts addresses, email addresses and home paths.
redact = [
  ['\b[\w.-]+\.tail[\w-]+\.ts\.net\b', '[host]'],
  ['\b[\w.-]+\.(?:local|lan)\b', '[host]'],
]

[withheld]
