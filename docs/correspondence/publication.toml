# Other reviewed messages (2867, 2886, 2891) contain scientific and implementation
# decisions, with no flagged content requiring clearance or withholding.
# 2891 records public commit/CI evidence, methodological limits and generic
# client configuration; it contains no credentials, private routes or paper text.
# 2912 and 2914 record the scientific cross-check, pre-freeze fixes and warning
# decision. Both were reviewed in full; neither needs clearance or withholding.
